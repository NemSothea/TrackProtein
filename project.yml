name: TrackProtein
options:
  bundleIdPrefix: com.sothea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PBJ22NG3WU
    ENABLE_PREVIEWS: YES
targets:
  TrackProtein:
    type: application
    platform: iOS
    sources:
      - TrackProtein
    dependencies:
      - target: TrackProteinWidgets
    entitlements:
      path: Configs/TrackProtein.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sothea.trackprotein
    info:
      path: Configs/TrackProtein-Info.plist
      properties:
        CFBundleDisplayName: TrackProtein
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.sothea.trackprotein
            CFBundleURLSchemes:
              - trackprotein
        NSCameraUsageDescription: TrackProtein uses the camera to scan food barcodes so you can log protein quickly.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sothea.trackprotein
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
  TrackProteinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TrackProteinTests
    dependencies:
      - target: TrackProtein
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TrackProteinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TrackProteinWidgets
      - TrackProtein/Core
    entitlements:
      path: Configs/TrackProteinWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sothea.trackprotein
    info:
      path: Configs/TrackProteinWidgets-Info.plist
      properties:
        CFBundleDisplayName: TrackProtein
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sothea.trackprotein.widgets
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
schemes:
  TrackProtein:
    build:
      targets:
        TrackProtein: all
    run:
      config: Debug
      storeKitConfiguration: TrackProtein.storekit
    test:
      config: Debug
      targets:
        - TrackProteinTests
    archive:
      config: Release
